rgin-bottom:18px}.crumbs a{text-decoration:none}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0 0 6px}h1{font-size:clamp(29px,3.4vw,45px);letter-spacing:-.04em;line-height:1.12;margin:0 0 12px;font-weight:740}.intro{max-width:850px;color:var(--muted);font-size:16px;margin:0 0 14px}.guidance{font-size:12px;color:var(--muted);margin:0}.boundary{display:flex;gap:22px;flex-wrap:wrap;margin:19px 0 25px;font-size:12px}.boundary strong{color:var(--muted);font-weight:500;margin-right:8px}.diagram{display:flex;flex-direction:column;gap:21px}.lane{border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;background:var(--paper);box-shadow:var(--shadow)}.lane-heading{display:flex;gap:10px;align-items:center;font-size:13px;margin:0 0 14px;font-weight:720}.dot{height:8px;width:8px;flex:none;border-radius:50%;background:var(--accent)}.failure{background:var(--badbg)}.failure .dot{background:var(--bad)}.recovery{background:var(--recoverybg)}.recovery .dot{background:var(--recovery)}.steps{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:26px;align-items:stretch;list-style:none;padding:0;margin:0}.step{position:relative;min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--paper);padding:13px 12px 12px;display:flex;flex-direction:column}.steps:not(.parallel) .step:not(:last-child):after{content:'→';position:absolute;right:-24px;top:36px;width:22px;text-align:center;color:var(--accent);font-size:20px}.step-top{display:flex;align-items:center;gap:8px}.step-top .info{margin-left:auto}.res{display:inline-flex;align-items:center;color:var(--kind,var(--muted))}.res svg{width:16px;height:16px}.kind{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--kind)}.step[data-kind]{border-left:3px solid var(--kind)}.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:16px;padding:10px 14px;border:1px solid var(- <body>
<header><div class="brand">{{BRAND}} <span>Architecture / Big picture</span></div><div class="top-actions"><a class="quiet" href="#root">Whole system</a><button class="quiet" id="theme" aria-label="Change colour theme">◐ Theme</button></div></header>
<div class="shell"><aside id="sidebar"><button class="quiet nav-toggle" style="display:none" id="nav-toggle">Browse modules ▾</button><p class="navtitle">Inside the system</p><input id="search" class="search" type="search" placeholder="Find a module…" aria-label="Find a module"><nav id="module-nav" aria-label="Module diagrams"></nav></aside>
<main id="main"><div id="crumbs" class="crumbs"></div><p class="eyebrow" id="level"></p><h1 id="title"></h1><p id="intro" class="intro"></p><p class="guidance">Follow the arrows. “Open diagram” shows what happens inside a module.</p><div id="boundary" class="boundary"></div><div id="topology" class="topo" aria-label="How this connects" hidden></div><div id="diagram" class="diagram" aria-label="Flow diagram"></div><div id="legend" class="legend" aria-label="Symbol and colour key" hidden></div><div id="children" class="module-links"></div><div id="gaps"></div><details class="evidence-section" id="evidence"><summary>Evidence, checks and earlier corrections</summary><div id="evidence-body"></div></details><footer id="footer"></footer></main></div>
<script>
'use strict';
const U={{DATA}};
/* Symbol + colour vocabulary, injected by render_universe.py from render_common.py (KIND_COLOR,
   RESOURCE_SHAPES). resourceType -> symbol, kind -> colour. Independent axes. */
const V={{VOCAB}};
const DOCTITLE=U.title||'Architecture';
/* Optional fields, defaulted ONCE so every reader below is unconditional. A project
   with no legacy node graph and no recorded verification renders exactly the same. */
U.nodes=U.nodes||[];U.edges=U.edges||[];U.verification=U.verification||{};
const KIND_GLOSS={current:'current behaviour',change:'delivered change',recovery:'recovery path',gate:'gate that can refuse',store:'persisted store',provider:'external provider',surface:'exposed surface',async:'off the request path',gap:'known gap',alert:'finding'};
/* SHALLOW: the author says this branch is thin. Same chip as render_common's .chip.shallow. */
function shallowChip(){const c=el('span','chip shallow','shallow');c.title='Marked shallow by its author: this is all that is known';return c;}
/* CORRECTED: this scene has been wrong before, and the superseded claim is kept visible in its
   evidence panel. render_common styles .chip.corrected; before this, nothing emitted it. */
function correctedChip(n){const c=el('span','chip corrected','corrected');c.title=n+' recorded correction'+(n===1?'':'s')+' — the superseded claim is kept below, under evidence';return c;}
function icon(r){const s=el('span','res');s.innerHTML=V.resources[r];s.title=V.resourceLabels[r];return s;}
const scenes=Object.fromEntries(U.hlds.map(h=>[h.id,h]));const source=Object.fromEntries(U.nodes.map(n=>[n.id,n]));
let active='root';const $=id=>document.getElementById(id);
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x;}
function link(id,label,cls){const a=el('a',cls,label);a.href='#'+id;return a;}
function path(id){const p=[];let s=scenes[id];while(s){p.unshift(s);s=scenes[s.parent];}return p;}
function refs(parent,items){if(!items?.length)return;const ul=el('ul','refs');for(const e of items)ul.append(el('li','',e.file+':'+e.line+(e.note?' — '+e.note:'')));parent.append(ul);}
function archive(parent,id){const n=source[id];if(!n)return;const det=el('details','archive-node');det.append(el('summary','',n.title+' · prior evidence'));const p=el('p','',n.summary);det.append(p);if(n.detail)det.append(el('p','',Array.isArray(n.detail)?n.detail.join(' · '):n.detail));
 if(n.provenance)det.append(el('p','', 'Last code check: '+n.provenance.verifiedAgainstCode));refs(det,n.evidence);
 for(const [i,c] of (n.corrections||[]).entries()){const box=el('div','correction');box.append(el('strong','',(i===(n.corrections.length-1)?'Latest correction · ':'Superseded correction · ')+c.date));box.append(el('p','old','Earlier claim: '+c.was));box.append(el('p','','Replacement at that time: '+c.now));box.append(el('p','','Evidence: '+c.why));det.append(box);}
 for(const m of n.metrics||[])det.append(el('p','',m.label+': '+m.value+' · '+m.source+' · '+m.window));parent.append(det);
}
function nav(){const parent=$('module-nav');parent.replaceChildren();const q=$('search').value.toLocaleLowerCase();function walk(id,depth){const h=scenes[id],kids=U.hlds.filter(x=>x.parent===id);const matches=h.title.toLocaleLowerCase().includes(q);if(q){if(matches){const a=link(id,h.title,'navitem'+(id===active?' active':''));if(id===active)a.setAttribute('aria-current','page');parent.append(a);}kids.forEach(k=>walk(k.id,depth+1));return;}
 const a=link(id,h.title,'navitem depth'+depth+(id===active?' active':''));if(id===active)a.setAttribute('aria-current','page');
 if(kids.length&&id!=='root'){const det=el('details','navgroup');det.open=path(active).some(x=>x.id===id);const sum=el('summary');sum.append(a);det.append(sum);const inner=el('div');kids.forEach(k=>{const sub=link(k.id,k.title,'navitem depth'+(depth+1)+(k.id===active?' active':''));if(k.id===active)sub.setAttribute('aria-current','page');inner.append(sub);for(const g of U.hlds.filter(x=>x.parent===k.id)){const ga=link(g.id,g.title,'navitem depth'+(depth+2)+(g.id===active?' active':''));inner.append(ga);}});det.append(inner);parent.append(det);}else parent.append(a);if(id==='root')kids.forEach(k=>walk(k.id,1));}
 walk('root',0);if(!parent.childElementCount)parent.append(el('p','empty','No module matches.'));}

/* ---- TOPOLOGY: nodes are HLDs, edges are typed connections between them. -----------------------
   Authored edges come from U.moduleEdges; where that is silent for a pair, an edge is DERIVED by
   lifting the legacy node graph (U.edges) through sourceIds to the owning HLD. Nothing is invented:
   every drawn edge is either authored or a lifted legacy edge. Layout is a small layered DAG
   (longest-path layers, barycentre order) drawn as inline SVG, so symbols, kind colours and both
   themes come from the same tokens as the cards. Click a box to open that HLD. */
const REL_DASH={reads:true,recovers:true,refuses:true};const REL_TXT={calls:'calls',awaits:'awaits',writes:'writes',reads:'reads',emits:'emits',flows_to:'',recovers:'recovers',refuses:'refuses'};
const kids=id=>U.hlds.filter(x=>x.parent===id);
function subtree(id){const s=new Set([id]);(function w(i){for(const k of kids(i)){s.add(k.id);w(k.id);}})(id);return s;}
function crossEdges(){const owner={};for(const h of U.hlds)for(const sid of h.sourceIds||[])owner[sid]=h.id;const out=(U.moduleEdges||[]).map(e=>({from:e.from,to:e.to,rel:e.rel,label:e.label,src:'authored'}));const have=new Set(out.map(e=>e.from+'>'+e.to));const seen=new Set();
 for(const e of U.edges){const a=owner[e.from],b=owner[e.to];if(!a||!b||a===b||have.has(a+'>'+b))continue;const k=a+'>'+b+'>'+e.rel;if(seen.has(k))continue;seen.add(k);out.push({from:a,to:b,rel:e.rel,src:'derived'});}return out;}
const EDGES=crossEdges();
/* A view over root HLDs at child grain: each root shows its children (or itself when it has none);
   everything else that connects to them is drawn dashed, as "outside". */
function view(roots){const lift={},inside=[],own=new Set();for(const r of roots){const ks=kids(r);if(ks.length){for(const k of ks){inside.push(k.id);for(const x of subtree(k.id))lift[x]=k.id;}lift[r]=r;own.add(r);}else{inside.push(r);lift[r]=r;}}
 const nodes=new Set(inside),edges=new Map();for(const e of EDGES){let a=lift[e.from],b=lift[e.to];if(!a&&!b)continue;a=a||e.from;b=b||e.to;if(a===b)continue;nodes.add(a);nodes.add(b);const k=a+'>'+b;const m=edges.get(k)||{from:a,to:b,rels:new Set(),label:null,src:'derived'};m.rels.add(e.rel);if(e.src==='authored'){m.src='authored';if(e.label&&!m.label)m.label=e.label;}edges.set(k,m);}
 return{nodes:[...nodes],edges:[...edges.values()],inside:new Set([...inside,...own]),roots:new Set(roots)};}
function layout(v){const touched=new Set(v.edges.flatMap(e=>[e.from,e.to]));const N=v.nodes.filter(n=>touched.has(n)),idx=Object.fromEntries(N.map((n,i)=>[n,i]));const outs=N.map(()=>[]),ins=N.map(()=>[]);for(const e of v.edges){outs[idx[e.from]].push(idx[e.to]);ins[idx[e.to]].push(idx[e.from]);}
 /* break cycles: DFS back-edges are ignored for layering only, never dropped from the drawing */
 const st=N.map(()=>0),back=new Set();function dfs(i){st[i]=1;for(const j of outs[i]){if(st[j]===1)back.add(i+'>'+j);else if(!st[j])dfs(j);}st[i]=2;}N.forEach((_,i)=>{if(!st[i])dfs(i);});
 const layer=N.map(()=>0);let changed=true,guard=0;while(changed&&guard++<N.length+2){changed=false;for(let i=0;i<N.length;i++)for(const j of outs[i]){if(back.has(i+'>'+j))continue;if(layer[j]<layer[i]+1){layer[j]=layer[i]+1;changed=true;}}}
 const L=Math.max(0,...layer)+1,cols=Array.from({length:L},()=>[]);N.forEach((_,i)=>cols[layer[i]].push(i));
 /* barycentre ordering, two sweeps; inside nodes before outside within a tie, then alphabetical for determinism */
 const pos=N.map(()=>0);cols.forEach(c=>{c.sort((a,b)=>(v.inside.has(N[a])?0:1)-(v.inside.has(N[b])?0:1)||N[a].localeCompare(N[b]));c.forEach((n,i)=>pos[n]=i);});
 for(let sweep=0;sweep<2;sweep++)for(let l=1;l<L;l++){const c=cols[l];c.sort((a,b)=>{const ba=ins[a].length?ins[a].reduce((s,p)=>s+pos[p],0)/ins[a].length:pos[a],bb=ins[b].length?ins[b].reduce((s,p)=>s+pos[p],0)/ins[b].length:pos[b];return ba-bb||pos[a]-pos[b];});c.forEach((n,i)=>pos[n]=i);}
 const W=176,H=58,GX=30,GY=66,P=14,wide=Math.max(...cols.map(c=>c.length));const XY={};cols.forEach((c,l)=>{const left=P+((wide-c.length)*(W+GX))/2;c.forEach((n,i)=>XY[N[n]]=[left+i*(W+GX),P+l*(H+GY)]);});
 const hasBack=v.edges.some(e=>back.has(idx[e.from]+'>'+idx[e.to]));return{XY,W,H,P,GX,GY,width:P*2+wide*W+(wide-1)*GX+(hasBack?70:0),height:P*2+L*H+(L-1)*GY,isolated:v.nodes.filter(n=>!touched.has(n))};}
function wrap2(t,n){const w=t.split(' '),o=[''];for(const x of w){if((o[o.length-1]+' '+x).trim().length>n&&o[o.length-1])o.push(x);else o[o.length-1]=(o[o.length-1]+' '+x).trim();}if(o.length>2){o.length=2;o[1]=o[1].replace(/[ ,;:·-]+$/,'')+' …';}return o;}
function topology(container,roots,focus){const v=view(roots);container.replaceChildren();if(!v.edges.length){container.hidden=true;return;}container.hidden=false;const g=layout(v);const NS='http://www.w3.org/2000/svg';const sv=document.createElementNS(NS,'svg');sv.setAttribute('viewBox','0 0 '+g.width+' '+g.height);sv.setAttribute('width',g.width);sv.setAttribute('height',g.height);sv.setAttribute('role','img');sv.setAttribute('aria-label','How '+(scenes[roots[0]]?.title||'this')+' connects');
 const defs=document.createElementNS(NS,'defs');defs.innerHTML='<marker id="topo-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>';sv.append(defs);
 const el2=(t,a)=>{const x=document.createElementNS(NS,t);for(const k in a)x.setAttribute(k,a[k]);return x;};
 const fan={};for(const e of v.edges){const [x1,y1]=g.XY[e.from],[x2,y2]=g.XY[e.to];let d,mx,my;/* stagger labels that share a target so neighbours never sit on one line */const stag=(fan[e.to]=(fan[e.to]||0)+1)%2?0:13;const span=Math.round((y2-y1)/(g.H+g.GY));if(y2>y1){const sx=x1+g.W/2,sy=y1+g.H,ex=x2+g.W/2,ey=y2,c=(ey-sy)/2;const bz=(t,p0,p1,p2,p3)=>(1-t)**3*p0+3*(1-t)**2*t*p1+3*(1-t)*t*t*p2+t**3*p3;if(span>1){const off=((sx+ex)/2<g.width/2?-1:1)*(g.W/2+14)*(span-1);d=`M${sx},${sy} C${sx+off},${sy+c} ${ex+off},${ey-c} ${ex},${ey}`;mx=(sx+ex)/2+off*0.75;my=(sy+ey)/2;}else{d=`M${sx},${sy} C${sx},${sy+c} ${ex},${ey-c} ${ex},${ey}`;/* label near the SOURCE (t=0.3) so fan-in labels spread with their sources instead of piling on the target */mx=bz(0.3,sx,sx,ex,ex);my=bz(0.3,sy,sy+c,ey-c,ey)+stag;}}else if(y2===y1){const l=x2>x1;const sx=l?x1+g.W:x1,ex=l?x2:x2+g.W,sy=y1+g.H/2;d=`M${sx},${sy} L${ex},${sy}`;mx=(sx+ex)/2;my=sy-8;}else{const sx=x1+g.W,sy=y1+g.H/2,ex=x2+g.W,ey=y2+g.H/2,bow=44+Math.abs(x2-x1)/4;d=`M${sx},${sy} C${sx+bow},${sy} ${ex+bow},${ey} ${ex},${ey}`;mx=Math.max(sx,ex)+bow*0.7;my=(sy+ey)/2;}
  const dash=[...e.rels].every(r=>REL_DASH[r]);const p=el2('path',{d,class:'edge'+(dash?' dash':''),'marker-end':'url(#topo-ah)'});p.append(el2('title',{}));p.firstChild.textContent=(e.label?e.label+' · ':'')+e.from+' → '+e.to+' · '+[...e.rels].join(', ')+(e.src==='derived'?' (derived from evidence graph)':'');sv.append(p);
  const full=e.label||'';const txt=(full&&span===1)?(full.length>26?full.slice(0,25).trimEnd()+'…':full):'';if(txt){const t=el2('text',{x:mx,y:my,'text-anchor':'middle',class:'elabel'});t.textContent=txt;const bg=el2('rect',{x:mx-txt.length*3.3-3,y:my-9,width:txt.length*6.6+6,height:12,rx:3,class:'elabel-bg'});sv.append(bg,t);}}
 for(const id of v.nodes){const h=scenes[id];if(!h||!g.XY[id])continue;const [x,y]=g.XY[id];const a=el2('a',{href:'#'+id,class:(focus.has(id)?'focus ':'')+(v.inside.has(id)?'':'outside')});a.style.setProperty('--node','var('+(h.kind?V.kinds[h.kind]:'--accent')+')');const store=h.kind==='store'||h.kind==='provider';a.append(el2('rect',{x,y,width:g.W,height:g.H,rx:store?3:9,class:'box'}));
  const parent=scenes[h.parent],eye=parent&&h.parent!=='root';const lines=wrap2(h.title,21);let ty=y+g.H/2-(lines.length*15)/2+11+(eye?6:0);if(eye){const eb=el2('text',{x:x+(h.resourceType?32:12),y:y+13,class:'eyebrow'});eb.textContent=parent.title.length>18?parent.title.slice(0,17).trimEnd()+'…':parent.title;a.append(eb);}
  if(h.resourceType){const s=el2('g',{transform:`translate(${x+8},${y+6})`,class:'sym'});s.innerHTML=V.resources[h.resourceType];a.append(s);}
  for(const ln of lines){const t=el2('text',{x:x+(h.resourceType&&!eye?32:12),y:ty,class:'ttl'});t.textContent=ln;a.append(t);ty+=15;}
  const tt=el2('title',{});tt.textContent=h.title+' — open';a.append(tt);sv.append(a);}
 const cap=el('div','cap');cap.append(document.createTextNode('How it connects · '+v.nodes.length+' parts, '+v.edges.length+' links'));if(PLANE.length&&!focus.has('plane-map')&&(roots[0]==='root'||PLANE.includes(roots[0])))cap.append(link('plane-map',PLANEMAP.linkLabel||(PLANEMAP.title+' ↗'),'quiet'));const key=el('span','key');key.innerHTML='<i></i>calls / writes / flows <i class="dash"></i>reads · dashed box = outside this module · click a box to open it';cap.append(key);
 const sc=el('div','scroll');sc.append(sv);container.append(cap,sc);if(g.isolated.length){const row=el('div','loose');row.append(el('span','','Not yet linked'));for(const id of g.isolated){const h=scenes[id];if(h)row.append(link(id,h.title,'quiet'));}container.append(row);}}
const PLANEMAP=U.planeMap||{};const PLANE=PLANEMAP.ids||[];
function renderPlane(){active='plane-map';nav();document.title=DOCTITLE;$('title').textContent=PLANEMAP.title||'Cross-module map';$('intro').textContent=PLANEMAP.intro||'Click a box to open it.';$('level').textContent='One map · '+PLANE.length+' modules';$('crumbs').replaceChildren();$('crumbs').append(link('root','The big picture'),el('span','','/'),el('span','',PLANEMAP.title||'Cross-module map'));
 for(const id of ['boundary','diagram','legend','children','gaps','evidence'])$(id).hidden=true;$('boundary').replaceChildren();$('diagram').replaceChildren();$('children').replaceChildren();$('gaps').replaceChildren();
 topology($('topology'),PLANE,new Set(['plane-map']));$('footer').textContent=U.hlds.length+' connected diagrams · Updated '+(U.hldUpdatedAt||'unrecorded')+' · Same architecture, one document';}

/* ---- STORY MAP: a scene whose every step is a pointer (`open`) is a system-context diagram already,
   so it is drawn as one: lanes become columns, each step becomes a box for the module it opens, the
   lane order is the story. Cards are not drawn for such a scene; the step summary lives in the tooltip. */
function pointerScene(h){return h.lanes.length>0&&h.lanes.every(l=>l.steps.length&&l.steps.every(s=>s.open&&scenes[s.open]));}
function storyMap(container,h){const NS='http://www.w3.org/2000/svg';const el2=(t,a)=>{const x=document.createElementNS(NS,t);for(const k in a)x.setAttribute(k,a[k]);return x;};
 const W=150,H=58,GX=36,GY=26,P=14,HEAD=44,n=h.lanes.length,rows=Math.max(...h.lanes.map(l=>l.steps.length));const width=P*2+n*W+(n-1)*GX,height=P*2+HEAD+rows*H+(rows-1)*GY;
 const sv=el2('svg',{viewBox:'0 0 '+width+' '+height,width,height,role:'img','aria-label':h.title+' — system map'});const defs=el2('defs',{});defs.innerHTML='<marker id="story-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>';sv.append(defs);
 h.lanes.forEach((l,i)=>{const x=P+i*(W+GX);const head=wrap2(l.label,20);head.forEach((ln,k)=>{const t=el2('text',{x:x+W/2,y:P+13+k*13,'text-anchor':'middle',class:'lanehead '+l.kind});t.textContent=ln;sv.append(t);});
  l.steps.forEach((s,k)=>{const y=P+HEAD+k*(H+GY),m=scenes[s.open];const a=el2('a',{href:'#'+s.open,class:'focus'});a.style.setProperty('--node','var('+(m.kind?V.kinds[m.kind]:'--accent')+')');a.append(el2('rect',{x,y,width:W,height:H,rx:(m.kind==='store'||m.kind==='provider')?3:9,class:'box'}));
   const eb=el2('text',{x:x+(m.resourceType?32:11),y:y+14,class:'eyebrow'});eb.textContent=s.title.length>18?s.title.slice(0,17).trimEnd()+'…':s.title;a.append(eb);if(m.resourceType){const g=el2('g',{transform:`translate(${x+8},${y+6})`,class:'sym'});g.innerHTML=V.resources[m.resourceType];a.append(g);}
   const lines=wrap2(m.title,19);let ty=y+34;for(const ln of lines){const t=el2('text',{x:x+11,y:ty,class:'ttl'});t.textContent=ln;a.append(t);ty+=14;}const tt=el2('title',{});tt.textContent=s.title+' · '+m.title+(s.summary?' — '+s.summary:'');a.append(tt);sv.append(a);
   if(k<l.steps.length-1){if(l.sequence===false){const dot=el2('circle',{cx:x+W/2,cy:y+H+GY/2,r:2,fill:'var(--line)'});sv.append(dot);}else sv.append(el2('path',{d:`M${x+W/2},${y+H} L${x+W/2},${y+H+GY-1}`,class:'edge','marker-end':'url(#story-ah)'}));}});});
 const fig=el('div','topo');const cap=el('div','cap');cap.append(document.createTextNode('The map · '+n+' journeys, '+h.lanes.reduce((a,l)=>a+l.steps.length,0)+' modules'));if(h.id==='root'&&PLANE.length)cap.append(link('plane-map',PLANEMAP.linkLabel||(PLANEMAP.title+' ↗'),'quiet'));const key=el('span','key');key.textContent='top to bottom in each column is the order things happen · click a box to open it';cap.append(key);const sc=el('div','scroll');sc.append(sv);fig.append(cap,sc);container.append(fig);}
function render(){let id='root';try{id=decodeURIComponent(location.hash.slice(1)||'root');}catch{}if(U.sceneAliases?.[id]){id=U.sceneAliases[id];history.replaceState(null,'','#'+id);}if(id==='plane-map'){if(PLANE.length){renderPlane();return;}id='root';history.replaceState(null,'','#root');}for(const s of ['boundary','diagram','legend','children','gaps','evidence'])$(s).hidden=false;if(!scenes[id]){const n=source[id];id=U.hlds.find(h=>(h.sourceIds||[]).includes(id))?.id|| (n&&scenes[n.parent]?n.parent:'root');}active=id;const h=scenes[id];document.title=DOCTITLE;nav();$('title').textContent=h.title;if(h.shallow===true)$('title').append(shallowChip());if(h.corrections?.length)$('title').append(correctedChip(h.corrections.length));$('intro').textContent=h.summary;$('level').textContent=id==='root'?'One system · the big picture':path(id).length===2?'Module diagram':'Inside the module';$('crumbs').replaceChildren();path(id).forEach((p,i)=>{if(i)$('crumbs').append(el('span','','/'));$('crumbs').append(link(p.id,p.title));});$('boundary').replaceChildren();for(const [label,key] of [['Comes in','inputs'],['Comes out','outputs']]){const box=el('div');box.append(el('strong','',label));box.append(document.createTextNode(h[key].join(' · ')));$('boundary').append(box);}
 if(id==='root'){$('topology').hidden=true;$('topology').replaceChildren();}else topology($('topology'),[id],new Set(kids(id).length?kids(id).map(k=>k.id):[id]));
 $('diagram').replaceChildren();if(pointerScene(h))storyMap($('diagram'),h);else h.lanes.forEach((l,li)=>{const lane=el('section','lane '+l.kind);const heading=el('h2','lane-heading');heading.append(el('span','dot'));heading.append(document.createTextNode(l.label+(l.sequence===false?' · separate cases':'')));lane.append(heading);const ol=el('ol','steps'+(l.sequence===false?' parallel':''));ol.style.setProperty('--cols',l.steps.length);
 l.steps.forEach((s,i)=>{const box=el('li','step');box.dataset.step=li+'-'+i;const top=el('div','step-top');top.append(el('span','number',l.sequence===false?'•':String(i+1).padStart(2,'0')));if(s.kind){box.dataset.kind=s.kind;box.style.setProperty('--kind','var('+V.kinds[s.kind]+')');}if(s.resourceType)top.append(icon(s.resourceType));if(s.kind)top.append(el('span','kind',s.kind));if(s.shallow===true)top.append(shallowChip());const hasInfo=s.detail?.length||s.evidence?.length;
 if(hasInfo){const b=el('button','info','ⓘ');b.setAttribute('aria-label','Details: '+s.title);b.setAttribute('aria-expanded','false');top.append(b);b.onclick=()=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));box.classList.toggle('expanded',!open);if(open)box.querySelector('.hop-detail')?.remove();else{const d=el('div','hop-detail');if(s.detail?.length){const ul=el('ul','detailbullets');s.detail.forEach(t=>ul.append(el('li','',t)));d.append(ul);}if(s.evidence?.length){const e=el('details','hop-evidence');e.append(el('summary','','Source'));refs(e,s.evidence);d.append(e);}box.append(d);}};}
 box.append(top,el('h3','',s.title),el('p','',s.summary));if(s.open)box.append(link(s.open,'Open diagram ↗','open'));ol.append(box);});lane.append(ol);$('diagram').append(lane);});
 const usedR=[...new Set(h.lanes.flatMap(l=>l.steps.map(s=>s.resourceType).filter(Boolean)))],usedK=[...new Set(h.lanes.flatMap(l=>l.steps.map(s=>s.kind).filter(Boolean)))];const lg=$('legend');lg.replaceChildren();lg.hidden=!(usedR.length||usedK.length);if(usedR.length){lg.append(el('strong','','Symbols'));for(const r of usedR){const sp=el('span');sp.append(icon(r),document.createTextNode(V.resourceLabels[r]));lg.append(sp);}}if(usedK.length){lg.append(el('strong','','Colours'));for(const k of usedK){const sp=el('span');const sw=el('i','swatch');sw.style.background='var('+V.kinds[k]+')';sp.append(sw,document.createTextNode(k+' · '+KIND_GLOSS[k]));lg.append(sp);}}
 $('children').replaceChildren();for(const child of U.hlds.filter(x=>x.parent===id))$('children').append(link(child.id,child.title+' ↗','quiet'));
 $('gaps').replaceChildren();if(false&&h.gaps?.length){const p=el('div','status-note');h.gaps.forEach(t=>p.append(el('p','',t)));$('gaps').append(p);}
 $('evidence').open=false;const e=$('evidence-body');e.replaceChildren();e.append(el('p','','Code checked '+h.provenance.verifiedAgainstCode+(U.verification.codeRevision?' · '+U.verification.codeRevision.slice(0,9):'')));if(U.verification.scope)e.append(el('p','',U.verification.scope));refs(e,h.evidence);if(h.timing)e.append(el('p','','Timing: '+h.timing));if(h.gaps?.length){e.append(el('strong','','Coverage limits'));for(const gap of h.gaps)e.append(el('p','',gap));}for(const obs of U.verification.observations||[]){const det=el('details','archive-node');det.append(el('summary','',obs.environment+' runtime check · '+obs.observedAt));for(const fact of [...obs.facts,...obs.limitations])det.append(el('p','',fact));e.append(det);}
 for(const c of h.corrections||[]){const box=el('div','correction');box.append(el('strong','','Correction · '+c.date));box.append(el('p','old','Earlier claim: '+c.was));box.append(el('p','','Now: '+c.now));box.append(el('p','','Evidence: '+c.why));e.append(box);}
 const visited=new Set();function addSource(id){if(visited.has(id))return;visited.add(id);archive(e,id);for(const n of U.nodes.filter(n=>n.parent===id))addSource(n.id);}for(const id of h.sourceIds||[])addSource(id);
 if(active==='root'&&U.nodes.length){const det=el('details','archive-node');det.append(el('summary','','Complete evidence archive · '+U.nodes.length+' records'));for(const n of U.nodes)archive(det,n.id);e.append(det);}
